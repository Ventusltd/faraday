each it?","observed":"0 lit early; the last cell switches at tick 58","numbers":{"cells":5042,"fronts_first_meet_tick":null,"last_cell_tick":58,"lit_early":0}}];const G=Math.PI*(3-Math.sqrt(5));const c=document.getElementById('c'),x=c.getContext('2d');let W,H,S,t0=performance.now(),sel=-1;
function fit(){const d=devicePixelRatio||1;W=c.clientWidth;H=Math.min(innerHeight*0.72,W);c.width=W*d;c.height=H*d;c.style.height=H+'px';x.setTransform(d,0,0,d,0,0);S=Math.min(W,H)*0.46/Math.sqrt(R.length+1)}
